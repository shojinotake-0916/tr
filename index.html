<title>筋トレ</title>
<style>
  :root { --bg: #f4f2ee; --surface: #ffffff; --ink: #1c1e21; --muted: #6b7078; --line: #d9d5cc; --accent: #c2410c; --accent-ink: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --surface: #1e2226; --ink: #eceae5; --muted: #9aa0a8; --line: #343a41; --accent: #f97316; --accent-ink: #14171a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: grid; place-items: center;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; padding: 24px 20px; }
  form { width: 100%; max-width: 320px; display: grid; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 28px; font-weight: 800; letter-spacing: 0.02em; }
  input, button { font: inherit; font-size: 17px; border-radius: 12px; padding: 13px 14px; width: 100%; }
  input { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  button:disabled { opacity: 0.6; }
  #m { margin: 0; min-height: 1.5em; font-size: 14px; color: var(--muted); }
</style>

  const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));

  // パスワードそのものは保存しない。導出した鍵を「取り出し不可」のまま IndexedDB に置く。
  async function deriveKey(pw) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(D.s), iterations: D.n, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function decryptWith(key) {
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.i) }, key, b64(D.c)));
  }
  function idb(mode, fn) {
    return new Promise((resolve, reject) => {
      const open = indexedDB.open("workout-page", 1);
      open.onupgradeneeded = () => open.result.createObjectStore("k");
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const tx = open.result.transaction("k", mode), req = fn(tx.objectStore("k"));
        tx.oncomplete = () => resolve(req.result); tx.onerror = () => reject(tx.error);
      };
    });
  }
  const loadKey = () => idb("readonly", s => s.get("aes"));
  const saveKey = key => idb("readwrite", s => s.put({ key, s: D.s }, "aes"));
  const dropKey = () => idb("readwrite", s => s.delete("aes"));

  // 書き込むのは AES-GCM の認証を通った中身だけ（このパスワードで暗号化した自作ページ以外は復号に失敗する）。
  function show(html) { document.open(); document.write(html); document.close(); }

  const f = document.getElementById("f"), p = document.getElementById("p"), b = document.getElementById("b"), m = document.getElementById("m");
  (async () => {
    try {
      const rec = await loadKey();
      if (rec && rec.s === D.s) { show(await decryptWith(rec.key)); return; }
    } catch (e) { try { await dropKey(); } catch (e2) {} }
    f.hidden = false; p.focus();
  })();
  f.addEventListener("submit", async ev => {
    ev.preventDefault(); b.disabled = true; m.textContent = "確認中…";
    try {
      const key = await deriveKey(p.value.trim());
      const html = await decryptWith(key);
      try { await saveKey(key); } catch (e) {}
      show(html);
    } catch (e) { m.textContent = "パスワードが違います"; b.disabled = false; p.select(); }
  });
